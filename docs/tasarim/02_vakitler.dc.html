<div style="background: #0F3D33; color: #FFFFFF; border-radius: 22px; padding: 20px; display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px">

<svg aria-hidden="true" width="64" height="64" sc-camel-view-box="0 0 24 24" fill="none" stroke="#E2C27A" stroke-width="0.7"><rect x="5" y="5" width="14" height="14"></rect><rect x="5" y="5" width="14" height="14" transform="rotate(45 12 12)"></rect><circle cx="12" cy="12" r="3"></circle></svg>

<div style="background: #FFFFFF; border: 1px solid #E1E5DF; border-radius: 22px; padding: 6px; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
<div style="{{row.rowStyle}}">
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 16px; font-weight: 700">{{row.name}}</span>
<sc-if value="{{row.hasBadge}}" hint-placeholder-val="{{false}}">
<span style="{{row.badgeStyle}}">{{row.badge}}</span>
</sc-if>
</div>
<span style="font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 500; margin-right: 8px">{{row.time}}</span>
<button aria-label="{{row.alarmLabel}}" aria-pressed="{{row.alarmPressed}}" sc-camel-on-click="{{row.toggle}}" style="{{row.alarmStyle}}">
<sc-if value="{{row.alarm}}" hint-placeholder-val="{{true}}">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg>
</sc-if>
<sc-if value="{{row.noAlarm}}" hint-placeholder-val="{{false}}">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 9.5-4.9"></path><path d="M18 11v5l1.5 2H8"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path><path d="M4 4l16 16"></path></svg>
</sc-if>
</button>
</div>
</sc-for>
</div>

<div style="background: #FFFFFF; border: 1px solid #E1E5DF; border-radius: 22px; padding: 18px; display: flex; align-items: center; gap: 16px">
<svg aria-hidden="true" width="72" height="72" sc-camel-view-box="0 0 72 72" fill="none"><circle cx="36" cy="36" r="33" stroke="#E1E5DF" stroke-width="2"></circle><circle cx="36" cy="36" r="25" stroke="#E3ECE7" stroke-width="1"></circle><text x="36" y="12" text-anchor="middle" font-size="8" font-weight="700" fill="#56625D" font-family="Manrope, sans-serif">K</text><g transform="rotate(151 36 36)"><path d="M36 10 L41 36 L36 32 L31 36 Z" fill="#0F3D33"></path><path d="M36 62 L41 36 L36 40 L31 36 Z" fill="#C9D3CE"></path></g><circle cx="36" cy="36" r="3" fill="#E2C27A"></circle></svg>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #56625D">Kıble yönü</span>
<span style="font-size: 17px; font-weight: 700">151° Güneydoğu</span>
<a href="#" style="font-size: 13px; font-weight: 700; color: #0F3D33; min-height: 28px; display: flex; align-items: center">Pusulayı aç</a>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { alarms: { imsak: true, gunes: false, ogle: true, ikindi: true, aksam: true, yatsi: true } };
  }
  renderVals() {
    const base = [
      { id: 'imsak', name: 'İmsak', time: '05:38', status: 'gecti' },
      { id: 'gunes', name: 'Güneş', time: '07:05', status: 'gecti' },
      { id: 'ogle', name: 'Öğle', time: '12:58', status: 'simdi' },
      { id: 'ikindi', name: 'İkindi', time: '16:06', status: 'sirada' },
      { id: 'aksam', name: 'Akşam', time: '18:47', status: '' },
      { id: 'yatsi', name: 'Yatsı', time: '20:03', status: '' }
    ];
    const alarms = this.state.alarms;
    const rows = base.map((r) => {
      const on = !!alarms[r.id];
      const isNext = r.status === 'sirada';
      const isNow = r.status === 'simdi';
      const past = r.status === 'gecti';
      let bg = 'transparent';
      if (isNext) bg = '#F4EBD6';
      return Object.assign({}, r, {
        alarm: on,
        noAlarm: !on,
        alarmPressed: on ? 'true' : 'false',
        alarmLabel: r.name + ' ezan bildirimi ' + (on ? 'açık' : 'kapalı'),
        hasBadge: isNext || isNow,
        badge: isNext ? 'Sıradaki vakit' : (isNow ? 'Şu anki vakit' : ''),
        badgeStyle: 'font-size: 12px; font-weight: 600; color: ' + (isNext ? '#8A6316' : '#0F3D33'),
        rowStyle: 'display: flex; align-items: center; padding: 12px 10px 12px 14px; border-radius: 16px; min-height: 52px; background: ' + bg + '; color: ' + (past ? '#6B7772' : '#17231F'),
        alarmStyle: 'width: 44px; height: 44px; border-radius: 14px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; background: ' + (on ? '#E3ECE7' : '#F3F4EF') + '; color: ' + (on ? '#0F3D33' : '#6B7772'),
        toggle: () => {
          const next = Object.assign({}, this.state.alarms);
          next[r.id] = !next[r.id];
          this.setState({ alarms: next });
        }
      });
    });
    return { rows };
  }
}
</script>


</body></html>
