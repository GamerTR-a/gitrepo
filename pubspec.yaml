name: abyad
description: "Abyad – reklamsız, verisiz, ücretsiz Müslüman rehberi."
publish_to: 'none'
version: 1.3.0+6

environment:
  sdk: ^3.11.3

# Paket eklemeden önce CLAUDE.md §2 (Değişmez İlkeler) ve §3'e bakın:
# analitik, reklam, çökme raporlama ve ağ gerektiren hiçbir paket eklenmez.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.5
  # drift 2.35+, Flutter SDK'nın sabitlediği meta sürümüyle çözülemiyor;
  # Flutter güncellenince üst sınır kaldırılabilir.
  drift: ">=2.30.0 <2.35.0"
  drift_flutter: ^0.3.1
  flutter_svg: ^2.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_local_notifications: ^22.3.1
  geolocator: ^14.1.1
  flutter_compass: ^0.8.1
  home_widget: ^0.10.0
  hijri: ^3.0.1
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ">=2.30.0 <2.34.6"
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/ornament/
    - assets/data/
    - assets/data/rehber/
    - assets/rehber/
    - assets/zikir_arkaplan/
    - assets/audio/rehber/
    - assets/data/quran/quran-uthmani.txt
    - assets/data/quran/quran_meta.json
    - assets/data/quran/mealler.json
    - assets/data/quran/meal/

  # Yazı tipleri uygulamanın içine gömülüdür; internetsiz çalışır.
  # Üçü de SIL Open Font License (OFL) ile ücretsizdir, lisanslar fonts/ klasöründe.
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces-Variable.ttf
    - family: Amiri
      fonts:
        - asset: fonts/Amiri-Regular.ttf
        - asset: fonts/Amiri-Bold.ttf
          weight: 700
